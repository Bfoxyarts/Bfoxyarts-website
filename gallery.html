<style>

body {
    font-family: Arial, sans-serif;

header {

    padding: 30px 20px;

.logo {
    width: 250px;

}

.gallery {
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(280px,1fr));

}

.card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,.12);

.card h3 {
    color: #274029;
    margin-top: 0;
}

.price {
    color: #B87333;
    font-weight: bold;
}

.available {
    color: green;
    font-weight: bold;
}

a {
    color: #B87333;
    text-decoration: none;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 30px;
    background: #274029;
    color: white;
    margin-top: 40px;
}
