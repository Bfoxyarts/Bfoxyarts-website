<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BfoxyArts | Wildlife Art by Bernadette Fox</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    margin:0;
    background:#F8F5EF;
    color:#2E2E2E;
}

header{
    background:#274029;
    color:white;
    padding:20px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:1200px;
    margin:auto;
}

nav ul{
    list-style:none;
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
}

.hero{
    text-align:center;
    padding:80px 20px;
    background:#e9ecef;
}

.hero h1{
    font-size:3rem;
    margin-bottom:10px;
}

.hero p{
    max-width:700px;
    margin:auto;
    font-size:1.2rem;
}

.button{
    display:inline-block;
    margin-top:25px;
    padding:12px 24px;
    background:#B87333;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.section{
    max-width:1200px;
    margin:auto;
    padding:60px 20px;
}

.section h2{
    color:#274029;
    text-align:center;
}

.collection-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    border-radius:8px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h3{
    margin-top:0;
    color:#274029;
}

.featured-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.artwork{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

footer{
    text-align:center;
    padding:30px;
    background:#274029;
    color:white;
}
</style>
</head>
